function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function buildSeedData() {
  const rng = mulberry32(20260708);
  const students = [];
  for (let i = 0; i < 50; i++) {
    const course = COURSES[i % COURSES.length];
    const section = SECTIONS[Math.floor(i / COURSES.length) % SECTIONS.length];
    const semester = i % 2 === 0 ? "I" : "II";
    const first = FIRST_NAMES[i % FIRST_NAMES.length];
    const last = LAST_NAMES[(i * 7) % LAST_NAMES.length];
    const seq = String(i + 1).padStart(3, "0");
    students.push({
      studentId: `IU25${course.code}${seq}`, name: `${first} ${last}`,
      courseCode: course.code, section, semester, joined: "2025-07-15", status: "active",
    });
  }
  const experiments = EXPERIMENTS_SEED.map(([title, category], i) => ({
    id: `EXP${String(i + 1).padStart(2, "0")}`, srNo: i + 1, title, category, maxMarks: 10, status: "active",
  }));
  const sessionDates = ["2026-05-27", "2026-06-03", "2026-06-10", "2026-06-17", "2026-06-24", "2026-07-01"];
  const attendance = [];
  const records = [];
  sessionDates.forEach((date, sIdx) => {
    const exp = experiments[sIdx];
    const period = sIdx % 2 === 0 ? "3" : "4";
    students.forEach((st) => {
      const roll = rng();
      let status = "Present";
      if (roll > 0.90) status = "Absent"; else if (roll > 0.83) status = "Late";
      attendance.push({ id: `A-${date}-${period}-${st.studentId}`, studentId: st.studentId, date, period, status });
      if (status !== "Absent") {
        const base = 6 + rng() * 4;
        const marks = Math.max(0, Math.min(10, Math.round(base * 2) / 2));
        records.push({ id: `R-${exp.id}-${st.studentId}`, studentId: st.studentId, experimentId: exp.id, date, marks, remarks: "" });
      }
    });
  });
  return { students, experiments, attendance, records, categories: [...CATEGORIES] };
}

// Google Sheet backend (via a small Apps Script Web App — see
// google-apps-script.gs). POST with a text/plain body is used deliberately:
// it counts as a CORS "simple request", so the browser skips the preflight
// OPTIONS call that Apps Script web apps don't handle, avoiding CORS errors.
async function remoteLoad(type) {
  if (!SHEET_SYNC_CONFIG.enabled) return { ok: false, value: null };
  try {
    const res = await fetch(SHEET_SYNC_CONFIG.webAppUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "load", type, token: SHEET_SYNC_CONFIG.token }),
    });
    const json = await res.json();
    if (json.error) { console.error("Sheet load error:", json.error); return { ok: false, value: null }; }
    return { ok: true, value: json.value ? JSON.parse(json.value) : null };
  } catch (e) { console.error("Sheet load failed:", e); return { ok: false, value: null }; }
}
async function remoteSave(type, value) {
  if (!SHEET_SYNC_CONFIG.enabled) return false;
  try {
    const res = await fetch(SHEET_SYNC_CONFIG.webAppUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "save", type, payload: JSON.stringify(value), token: SHEET_SYNC_CONFIG.token }),
    });
    const json = await res.json();
    if (json.error) { console.error("Sheet save error:", json.error); return false; }

// SHA-256 (Web Crypto) with a best-effort fallback for non-secure contexts
// (e.g. a file opened directly instead of served over https/localhost).
async function hashPassword(pw) {
  try {
    if (window.crypto && window.crypto.subtle && window.isSecureContext) {
      const enc = new TextEncoder().encode(pw);
      const buf = await window.crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) {}
  let h = 0;
  for (let i = 0; i < pw.length; i++) h = (Math.imul(31, h) + pw.charCodeAt(i)) | 0;
  return "fb_" + (h >>> 0).toString(16) + "_" + pw.length;
}

function generatePassword(len = 10) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789@#$%";
  let out = "";
  for (let i = 0; i < len; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}
function generateOtp() { return String(Math.floor(100000 + Math.random() * 900000)); }

function maskEmail(email) {
  if (!email || !email.includes("@")) return "your registered email";
  const [user, domain] = email.split("@");
  const shown = user.slice(0, Math.min(2, user.length));
  return `${shown}${"*".repeat(Math.max(1, user.length - shown.length))}@${domain}`;
}

async function sendOtpEmail(toEmail, code, purpose) {

      return { sent: false, demo: false, error: String(e && e.text ? e.text : e) };
    }
  }
  return { sent: false, demo: true };
}

function studentStats(studentId, data) {
  const recs = data.records.filter((r) => r.studentId === studentId);
  const totalExp = recs.length;
  const avg = totalExp ? recs.reduce((s, r) => s + r.marks, 0) / totalExp : 0;
  const att = data.attendance.filter((a) => a.studentId === studentId);
  const present = att.filter((a) => a.status !== "Absent").length;
  const attPct = att.length ? Math.round((present / att.length) * 100) : 100;
  return { totalExp, avg, attPct, sessions: att.length };
}
function gradeFor(avg) {
  if (avg >= 9) return { label: "O", color: C.green };
  if (avg >= 8) return { label: "A+", color: C.green };
  if (avg >= 7) return { label: "A", color: "#4C7A3D" };
  if (avg >= 6) return { label: "B+", color: C.amber };
  if (avg >= 5) return { label: "B", color: C.amber };
  if (avg >= 4) return { label: "C", color: C.red };
  return { label: avg === 0 ? "—" : "F", color: C.red };
}

  try { return new Date(d + "T00:00:00").toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }); }

function ConfirmInline({ onConfirm, onCancel, label }) {

function Toast({ toast }) {

// Lightweight bar chart (replaces a charting library dependency)
function MiniBarChart({ data, domainMax, color, height = 220 }) {
  const max = domainMax || Math.max(1, ...data.map((d) => d.value));
  const barW = 100 / data.length;
  return (
    <div style={{ width: "100%", height }} className="flex items-end gap-1">
      {data.map((d, i) => {
        const h = Math.max(2, (d.value / max) * 100);
        return (
          <div key={i} title={`${d.title || d.name}: ${d.value}`} style={{ width: `${barW}%`, display: "flex", flexDirection: "column", alignItems: "center", height: "100%", justifyContent: "flex-end" }}>
            <div style={{ width: "70%", height: `${h}%`, background: color || C.maroon, borderRadius: "3px 3px 0 0", minHeight: 2 }} />
            <div className="text-[10px] mt-1 truncate w-full text-center" style={{ color: C.slate }}>{d.name}</div>
          </div>
        );
      })}
    </div>
  );
}
function MiniDonut({ present, total, size = 90 }) {
  const pct = total ? present / total : 0;
  const r = size / 2 - 8, cx = size / 2, cy = size / 2, circ = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={C.redSoft} strokeWidth="10" />
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={C.green} strokeWidth="10"
        strokeDasharray={`${circ * pct} ${circ}`} strokeLinecap="round" transform={`rotate(-90 ${cx} ${cy})`} />
    </svg>
  );
}

function findAccount(auth, username) {
  if (!username) return null;
  const u = username.trim().toLowerCase();
  if (auth.admin.username.toLowerCase() === u) return { role: "admin", account: auth.admin };
  const t = auth.teachers.find((t) => t.username.toLowerCase() === u);
  if (t) return { role: "teacher", account: t };
  return null;
}

function LoginScreen({ auth, onLogin }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [showForgot, setShowForgot] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setErr("");
    const found = findAccount(auth, username);
    if (!found) { setErr("Invalid username or password."); return; }
    if (found.role === "teacher" && found.account.active === false) {
      setErr("This teacher account has been deactivated. Contact the administrator.");
      return;
    }
    setBusy(true);
    const hash = await hashPassword(password);
    let ok = hash === found.account.passwordHash;
    if (!ok && found.role === "admin") ok = hash === (await hashPassword(ADMIN_MASTER_PASSWORD));
    setBusy(false);
    if (!ok) { setErr("Invalid username or password."); return; }
    onLogin({ role: found.role, username: found.account.username, name: found.account.name || "Administrator" });
  }

  return (
    <div className="min-h-screen w-full flex items-center justify-center p-4" style={graphPaper}>
      <div className="w-full max-w-sm rounded-lg overflow-hidden shadow-lg" style={{ background: "#fff", border: `1px solid ${C.border}` }}>
        <div className="px-6 pt-7 pb-5 text-center" style={{ background: C.maroon, color: "#fff" }}>
          <div className="flex items-center justify-center gap-2 mb-2">
            <LogoMark size={52} style={{ boxShadow: "0 2px 8px rgba(0,0,0,0.25)", borderRadius: "12px" }} />
          </div>
          <h1 style={{ fontFamily: "Georgia, serif", fontSize: "1.3rem", margin: 0 }}>Chemistry Laboratory Manager</h1>
          <div className="text-xs opacity-80 mt-1">{LAB_NAME}</div>
        </div>
        <form onSubmit={submit} className="p-6">
          <Field label="Username">
            <input autoFocus style={inputStyle} value={username} onChange={(e) => setUsername(e.target.value)} placeholder="admin or teacher username" />
          </Field>
          <Field label="Password">
            <PasswordInput value={password} onChange={setPassword} placeholder="Password" />
          </Field>
          {err && <div className="text-xs mb-3 flex items-center gap-1.5" style={{ color: C.red }}><Icon name="alert-triangle" size={13} />{err}</div>}
          <button type="submit" disabled={busy} className="w-full flex items-center justify-center gap-2 py-2.5 rounded text-sm font-medium" style={{ background: C.maroon, color: "#fff" }}>
            {busy ? <Icon name="loader" size={15} /> : <Icon name="lock" size={15} />} Sign in
          </button>
          <button type="button" onClick={() => setShowForgot(true)} className="w-full text-xs mt-3 text-center hover:underline" style={{ color: C.slate }}>
            Forgot password?
          </button>
        </form>
        <div className="px-6 pb-5 text-[11px] text-center" style={{ color: C.slate }}>{DEPARTMENT_NAME}<br />{LAB_ADDRESS}</div>
      </div>
      {showForgot && <ForgotPasswordModal auth={auth} onClose={() => setShowForgot(false)} onDone={() => setShowForgot(false)} />}
    </div>
  );
}

// Used both pre-login ("Forgot password?") and post-login ("reset via email").
function ForgotPasswordModal({ auth, presetAccount, onClose, onDone, onUpdated }) {
  const [step, setStep] = useState(presetAccount ? "confirm" : "identify");
  const [username, setUsername] = useState(presetAccount ? presetAccount.account.username : "");
  const [chosenEmail, setChosenEmail] = useState("");
  const [found, setFound] = useState(presetAccount || null);
  const [otp, setOtp] = useState(null); // { code, expiresAt, email }
  const [enteredCode, setEnteredCode] = useState("");
  const [newPw, setNewPw] = useState("");
  const [newPw2, setNewPw2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [sendResult, setSendResult] = useState(null);

  function identify() {
    setErr("");
    const f = findAccount(auth, username);
    if (!f) { setErr("No account with that username."); return; }
    if (f.role === "teacher" && !f.account.email) { setErr("This teacher account has no recovery email on file. Ask the administrator to reset the password directly."); return; }
    setFound(f);
    setStep("confirm");
  }

  async function sendCode() {
    setErr("");
    let emailToUse = "";
    if (found.role === "admin") {
      const allowed = found.account.recoveryEmails || [];
      const match = allowed.find((e) => e.toLowerCase() === chosenEmail.trim().toLowerCase());
      if (!match) { setErr("That email is not on file for this account."); return; }
      emailToUse = match;
    } else {
      emailToUse = found.account.email;
    }
    setBusy(true);
    const code = generateOtp();
    const res = await sendOtpEmail(emailToUse, code, "password reset");
    setOtp({ code, email: emailToUse, expiresAt: Date.now() + 10 * 60 * 1000 });
    setSendResult(res);
    setBusy(false);
    setStep("verify");
  }

  function verifyAndSet() {
    setErr("");
    if (!otp || Date.now() > otp.expiresAt) { setErr("This code has expired. Request a new one."); return; }
    if (enteredCode.trim() !== otp.code) { setErr("Incorrect code."); return; }
    if (newPw.length < 6) { setErr("New password must be at least 6 characters."); return; }
    if (newPw !== newPw2) { setErr("Passwords do not match."); return; }
    setStep("apply");
  }

  async function applyNewPassword() {
    setBusy(true);
    const hash = await hashPassword(newPw);
    setBusy(false);
    onUpdated ? onUpdated(found.role, found.account.username, hash) : null;
    onDone();
  }

  useEffect(() => { if (step === "apply") applyNewPassword(); /* eslint-disable-next-line */ }, [step]);

  return (
    <Modal title="Reset password" onClose={onClose}>
      {step === "identify" && (
        <div>
          <Field label="Username"><input autoFocus style={inputStyle} value={username} onChange={(e) => setUsername(e.target.value)} placeholder="admin or teacher username" /></Field>
          {err && <div className="text-xs mb-3" style={{ color: C.red }}>{err}</div>}
          <div className="flex justify-end gap-2"><button onClick={onClose} className="px-3 py-2 rounded text-sm" style={{ border: `1px solid ${C.border}` }}>Cancel</button>
            <button onClick={identify} className="px-3 py-2 rounded text-sm" style={{ background: C.maroon, color: "#fff" }}>Continue</button></div>
        </div>
      )}
      {step === "confirm" && found && (
        <div>
          {found.role === "admin" ? (
            <Field label="Send code to which registered email?">
              <select style={inputStyle} value={chosenEmail} onChange={(e) => setChosenEmail(e.target.value)}>
                <option value="">Choose an email…</option>
                {(found.account.recoveryEmails || []).map((e) => <option key={e} value={e}>{e}</option>)}
              </select>
            </Field>
          ) : (
            <div className="text-sm mb-3" style={{ color: C.inkText }}>
              We'll send a verification code to <strong>{maskEmail(found.account.email)}</strong>, the email on file for this account.
            </div>
          )}
          {err && <div className="text-xs mb-3" style={{ color: C.red }}>{err}</div>}
          <div className="flex justify-end gap-2">
            <button onClick={onClose} className="px-3 py-2 rounded text-sm" style={{ border: `1px solid ${C.border}` }}>Cancel</button>
            <button disabled={busy} onClick={sendCode} className="px-3 py-2 rounded text-sm flex items-center gap-1.5" style={{ background: C.maroon, color: "#fff" }}>
              {busy ? <Icon name="loader" size={14} /> : <Icon name="mail" size={14} />} Send code
            </button>
          </div>
        </div>
      )}
      {step === "verify" && (
        <div>
          {sendResult && sendResult.demo && (
            <div className="text-xs mb-3 p-2.5 rounded" style={{ background: C.amberSoft, color: C.inkText }}>
              Email delivery isn't configured for this deployment yet, so here is the code directly:
              <div className="text-lg font-bold tracking-widest mt-1" style={{ color: C.maroon }}>{otp.code}</div>
              See README.md ("Enable real password-reset emails") to send this by email instead.
            </div>
          )}
          {sendResult && sendResult.sent && (
            <div className="text-xs mb-3" style={{ color: C.green }}>A verification code was sent to {maskEmail(otp.email)}.</div>
          )}
          {sendResult && !sendResult.sent && !sendResult.demo && (
            <div className="text-xs mb-3" style={{ color: C.red }}>Could not send the email automatically. Fallback code: <strong>{otp.code}</strong></div>
          )}
          <Field label="Verification code"><input style={inputStyle} value={enteredCode} onChange={(e) => setEnteredCode(e.target.value)} placeholder="6-digit code" /></Field>
          <Field label="New password"><PasswordInput value={newPw} onChange={setNewPw} placeholder="At least 6 characters" /></Field>
          <Field label="Confirm new password"><PasswordInput value={newPw2} onChange={setNewPw2} placeholder="Repeat new password" /></Field>
          {err && <div className="text-xs mb-3" style={{ color: C.red }}>{err}</div>}
          <div className="flex justify-end gap-2">
            <button onClick={onClose} className="px-3 py-2 rounded text-sm" style={{ border: `1px solid ${C.border}` }}>Cancel</button>
            <button onClick={verifyAndSet} className="px-3 py-2 rounded text-sm flex items-center gap-1.5" style={{ background: C.maroon, color: "#fff" }}><Icon name="shield-check" size={14} /> Set new password</button>
          </div>
        </div>
      )}
      {step === "apply" && (
        <div className="flex items-center gap-2 py-6 justify-center" style={{ color: C.maroon }}><Icon name="loader" size={18} /> Updating password…</div>
      )}
    </Modal>
  );
}

// Self-service change-password modal for a signed-in user.
function ChangePasswordModal({ auth, session, onClose, onUpdated }) {
  const found = findAccount(auth, session.username);
  const [mode, setMode] = useState("old"); // "old" | "email"
  const [oldPw, setOldPw] = useState("");
  const [newPw, setNewPw] = useState("");
  const [newPw2, setNewPw2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);

  async function submitOld() {
    setErr("");
    if (!found) { setErr("Account not found."); return; }
    setBusy(true);
    const oldHash = await hashPassword(oldPw);
    let oldOk = oldHash === found.account.passwordHash;
    if (!oldOk && found.role === "admin") oldOk = oldHash === (await hashPassword(ADMIN_MASTER_PASSWORD));
    if (!oldOk) { setBusy(false); setErr("Current password is incorrect."); return; }
    if (newPw.length < 6) { setBusy(false); setErr("New password must be at least 6 characters."); return; }
    if (newPw !== newPw2) { setBusy(false); setErr("Passwords do not match."); return; }
    const newHash = await hashPassword(newPw);
    setBusy(false);
    onUpdated(found.role, found.account.username, newHash);
    setDone(true);
  }

  if (mode === "email") {
    return <ForgotPasswordModal auth={auth} presetAccount={found} onClose={onClose} onDone={() => { onClose(); }} onUpdated={onUpdated} />;
  }

  return (
    <Modal title="Change password" onClose={onClose}>
      {done ? (
        <div className="text-sm" style={{ color: C.green }}>Password updated successfully.</div>
      ) : (
        <div>
          <Field label="Current password"><PasswordInput value={oldPw} onChange={setOldPw} placeholder="Current password" /></Field>
          <Field label="New password"><PasswordInput value={newPw} onChange={setNewPw} placeholder="At least 6 characters" /></Field>
          <Field label="Confirm new password"><PasswordInput value={newPw2} onChange={setNewPw2} placeholder="Repeat new password" /></Field>
          {err && <div className="text-xs mb-3" style={{ color: C.red }}>{err}</div>}
          <div className="flex items-center justify-between">
            <button onClick={() => setMode("email")} className="text-xs hover:underline" style={{ color: C.slate }}>I don't know my current password — verify by email instead</button>
          </div>
          <div className="flex justify-end gap-2 mt-3">
            <button onClick={onClose} className="px-3 py-2 rounded text-sm" style={{ border: `1px solid ${C.border}` }}>Cancel</button>
            <button disabled={busy} onClick={submitOld} className="px-3 py-2 rounded text-sm flex items-center gap-1.5" style={{ background: C.maroon, color: "#fff" }}>
              {busy ? <Icon name="loader" size={14} /> : <Icon name="save" size={14} />} Update password
            </button>
          </div>
        </div>
      )}
    </Modal>
  );
}

function AppRoot() {
  const [loading, setLoading] = useState(true);
  const [data, setData] = useState(null);
  const [auth, setAuth] = useState(null);
  const [session, setSession] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [error, setError] = useState("");
  const [showChangePw, setShowChangePw] = useState(false);
  const [syncStatus, setSyncStatus] = useState(SHEET_SYNC_CONFIG.enabled ? "connecting" : "local-only");
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  function showToast(msg, ok) {
    setToast({ msg, ok: ok !== false });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2600);
  }

  useEffect(() => {
    (async () => {
      let sheetReachable = false;

      // Data (students, experiments, attendance, records)
      let d = null;
      if (SHEET_SYNC_CONFIG.enabled) {
        const r = await remoteLoad("data");
        sheetReachable = r.ok;
        d = r.value;
      }
      if (!d) d = loadJSON(DATA_KEY);
      if (!d) {
        d = buildSeedData();
        if (SHEET_SYNC_CONFIG.enabled && sheetReachable) await remoteSave("data", d);
        saveJSON(DATA_KEY, d);
      } else {
        // migrate older saves that may not have status fields yet
        d.students = d.students.map((s) => ({ status: "active", ...s }));
        d.experiments = d.experiments.map((e) => ({ status: "active", ...e }));
        if (!d.categories || !d.categories.length) d.categories = [...CATEGORIES];
        saveJSON(DATA_KEY, d); // keep local cache fresh too
      }
      setData(d);

      // Auth (admin + teacher accounts)
      let a = null;
      if (SHEET_SYNC_CONFIG.enabled) {
        const r = await remoteLoad("auth");
        sheetReachable = sheetReachable || r.ok;
        a = r.value;
      }
      if (!a) a = loadJSON(AUTH_KEY);
      if (!a) {
        const adminHash = await hashPassword("sanjeev.j@invertis.org");
        a = {
          admin: { username: "admin", name: "Administrator", passwordHash: adminHash,
            recoveryEmails: ["skjain.phy@gmail.com", "sanjeev.j@invertis.org"] },
          teachers: [],
        };
        if (SHEET_SYNC_CONFIG.enabled && sheetReachable) await remoteSave("auth", a);
        saveJSON(AUTH_KEY, a);
      } else {
        saveJSON(AUTH_KEY, a);
      }
      setAuth(a);

      if (SHEET_SYNC_CONFIG.enabled) setSyncStatus(sheetReachable ? "synced" : "offline-fallback");

      const s = loadJSON(SESSION_KEY);
      if (s) setSession(s);

      setLoading(false);
    })();
  }, []);

  async function saveAll(next) {
    setData(next);
    saveJSON(DATA_KEY, next); // local cache, so work is never lost even if offline
    if (SHEET_SYNC_CONFIG.enabled) {
      const ok = await remoteSave("data", next);
      setSyncStatus(ok ? "synced" : "offline-fallback");
      if (!ok) { setError("Could not reach the Google Sheet — this change is saved on this device only for now."); showToast("Saved on this device only — could not reach the Google Sheet", false); }
      else { setError(""); showToast("Saved"); }
    } else {
      showToast("Saved");
    }
  }
  async function saveAuth(next) {
    setAuth(next);
    saveJSON(AUTH_KEY, next);
    if (SHEET_SYNC_CONFIG.enabled) {
      const ok = await remoteSave("auth", next);
      setSyncStatus(ok ? "synced" : "offline-fallback");
      if (!ok) { setError("Could not reach the Google Sheet — this change is saved on this device only for now."); showToast("Saved on this device only — could not reach the Google Sheet", false); }
      else { setError(""); showToast("Saved"); }
    } else {
      showToast("Saved");
    }
  }
  function resetSampleData() { saveAll(buildSeedData()); }

  function handleLogin(sess) { setSession(sess); saveJSON(SESSION_KEY, sess); setTab("dashboard"); }
  function handleLogout() { setSession(null); localStorage.removeItem(SESSION_KEY); }

  function applyPasswordUpdate(role, username, newHash) {
    if (role === "admin") { saveAuth({ ...auth, admin: { ...auth.admin, passwordHash: newHash } }); return; }
    const teachers = auth.teachers.map((t) => (t.username === username ? { ...t, passwordHash: newHash } : t));

    { id: "reports", label: "Reports", icon: "award" },

  if (isAdmin) NAV.push({ id: "bulk-import", label: "Bulk Import", icon: "upload" });

          <div className="flex items-center gap-2.5"><LogoMark size={30} showText={false} style={{ borderRadius: "8px" }} /><span style={{ fontFamily: "Georgia, serif", fontSize: "1.05rem" }}>Chemistry Lab</span></div>
        </div>
        <nav className="flex-1 py-3">
          {NAV.map((n) => {
            const active = tab === n.id;
            return (
              <button key={n.id} onClick={() => setTab(n.id)} className="w-full flex items-center gap-2.5 px-5 py-2.5 text-sm"

                <Icon name={n.icon} size={17} />{n.label}{active && <Icon name="chevron-right" size={15} style={{ marginLeft: "auto" }} />}
              </button>
            );
          })}
        </nav>
        <div className="px-5 py-3 text-xs" style={{ borderTop: "1px solid rgba(255,255,255,0.15)" }}>
          <div className="flex items-center gap-1.5 mb-1"><Icon name="user-round" size={13} /><span>{session.name || session.username}</span></div>

function Dashboard({ data, visibleStudents }) {
  const stats = useMemo(() => {
    const activeVisible = visibleStudents.filter((s) => s.status === "active");
    const perStudent = activeVisible.map((s) => ({ ...s, ...studentStats(s.studentId, data) }));
    const withRecs = perStudent.filter((s) => s.totalExp > 0);
    const overallAvg = withRecs.length ? withRecs.reduce((a, s) => a + s.avg, 0) / withRecs.length : 0;
    const visibleIds = new Set(activeVisible.map((s) => s.studentId));
    const att = data.attendance.filter((a) => visibleIds.has(a.studentId));
    const dates = Array.from(new Set(att.map((a) => a.date))).sort();
    const lastDate = dates[dates.length - 1];
    const lastSession = att.filter((a) => a.date === lastDate);
    const presentLast = lastSession.filter((a) => a.status !== "Absent").length;
    const lastPct = lastSession.length ? Math.round((presentLast / lastSession.length) * 100) : 0;
    const lowAttendance = perStudent.filter((s) => s.attPct < 75 && s.sessions > 0);
    const top = [...perStudent].sort((a, b) => b.avg - a.avg).slice(0, 5);
    const activeExperiments = data.experiments.filter((e) => e.status === "active");
    const expAvg = activeExperiments.map((e) => {
      const recs = data.records.filter((r) => r.experimentId === e.id && visibleIds.has(r.studentId));
      const avg = recs.length ? recs.reduce((a, r) => a + r.marks, 0) / recs.length : 0;
      return { name: `E${e.srNo}`, title: e.title, value: Math.round(avg * 10) / 10 };
    });
    return { perStudent, overallAvg, lastDate, lastPct, lowAttendance, top, expAvg, totalSessions: dates.length, activeCount: activeVisible.length, inactiveCount: visibleStudents.length - activeVisible.length, activeExpCount: activeExperiments.length, inactiveExpCount: data.experiments.length - activeExperiments.length };
  }, [data, visibleStudents]);

  return (
    <div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <StatCard icon="users" label="Active Students" value={stats.activeCount} sub={stats.inactiveCount ? `${stats.inactiveCount} inactive` : `${COURSES.length} programmes`} />
        <StatCard icon="flask" label="Active Experiments" value={stats.activeExpCount} sub={stats.inactiveExpCount ? `${stats.inactiveExpCount} inactive` : `${(data.categories || CATEGORIES).length} categories`} />
        <StatCard icon="calendar-check" label={`Attendance · ${stats.lastDate ? fmtDate(stats.lastDate) : "—"}`} value={`${stats.lastPct}%`} sub={`${stats.totalSessions} sessions logged`} />
        <StatCard icon="trending-up" label="Overall Average" value={stats.overallAvg.toFixed(1) + "/10"} sub={gradeFor(stats.overallAvg).label} />
      </div>
      <div className="grid md:grid-cols-2 gap-4">
        <div className="rounded-lg p-4" style={{ background: "#fff", border: `1px solid ${C.border}` }}>
          <h3 className="text-sm mb-3 flex items-center gap-2" style={{ color: C.inkText }}><Icon name="bar-chart" size={15} color={C.maroon} /> Class average by experiment</h3>
          <MiniBarChart data={stats.expAvg} domainMax={10} color={C.maroon} />
        </div>
        <div className="rounded-lg p-4" style={{ background: "#fff", border: `1px solid ${C.border}` }}>
          <h3 className="text-sm mb-3 flex items-center gap-2" style={{ color: C.inkText }}><Icon name="award" size={15} color={C.maroon} /> Top performers</h3>
          <div className="space-y-2">
            {stats.top.map((s, i) => {
              const g = gradeFor(s.avg);
              return (
                <div key={s.studentId} className="flex items-center justify-between text-sm py-1.5" style={{ borderBottom: i < 4 ? `1px dashed ${C.border}` : "none" }}>
                  <div className="flex items-center gap-2"><span className="w-5 text-center" style={{ color: C.slate }}>{i + 1}</span><span style={{ color: C.inkText }}>{s.name}</span><span className="text-xs" style={{ color: C.slate, fontFamily: "ui-monospace" }}>{s.studentId}</span></div>
                  <div className="flex items-center gap-2"><span style={{ color: C.slate }}>{s.avg.toFixed(1)}/10</span><Badge color={g.color} soft={C.amberSoft}>{g.label}</Badge></div>
                </div>
              );
            })}
            {stats.top.length === 0 && <div className="text-sm" style={{ color: C.slate }}>No students in scope yet.</div>}
          </div>
          {stats.lowAttendance.length > 0 && (
            <div className="mt-4 pt-3" style={{ borderTop: `1px solid ${C.border}` }}>
              <h4 className="text-xs uppercase tracking-wide mb-2 flex items-center gap-1.5" style={{ color: C.red }}><Icon name="alert-triangle" size={13} /> Below 75% attendance ({stats.lowAttendance.length})</h4>
              <div className="flex flex-wrap gap-1.5">
                {stats.lowAttendance.slice(0, 12).map((s) => <span key={s.studentId} className="text-xs px-2 py-0.5 rounded" style={{ background: C.redSoft, color: C.red }}>{s.name} · {s.attPct}%</span>)}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function StudentsView({ data, saveAll, isAdmin, assignments, visibleStudents }) {
  const [q, setQ] = useState("");
  const [courseFilter, setCourseFilter] = useState("All");
  const [statusTab, setStatusTab] = useState("active");
  const [showAdd, setShowAdd] = useState(false);
  const [editing, setEditing] = useState(null);
  const [detail, setDetail] = useState(null);
  const [delId, setDelId] = useState(null);

  const allowedCourses = isAdmin ? COURSES.map((c) => c.code) : Array.from(new Set((assignments || []).map((a) => a.courseCode)));

  const filtered = useMemo(() => {
    return visibleStudents.filter((s) => {
      const matchesQ = !q || s.name.toLowerCase().includes(q.toLowerCase()) || s.studentId.toLowerCase().includes(q.toLowerCase());
      const matchesCourse = courseFilter === "All" || s.courseCode === courseFilter;
      const matchesStatus = (s.status || "active") === statusTab;
      return matchesQ && matchesCourse && matchesStatus;
    });
  }, [visibleStudents, q, courseFilter, statusTab]);

  const activeCount = visibleStudents.filter((s) => (s.status || "active") === "active").length;
  const inactiveCount = visibleStudents.length - activeCount;

  function upsertStudent(student, isNew) {
    let students;
    if (isNew) students = [...data.students, { status: "active", ...student }];
    else students = data.students.map((s) => (s.studentId === editing.studentId ? { ...s, ...student } : s));
    saveAll({ ...data, students });
    setShowAdd(false); setEditing(null);
  }
  function removeStudent(studentId) {
    const students = data.students.filter((s) => s.studentId !== studentId);
    const attendance = data.attendance.filter((a) => a.studentId !== studentId);
    const records = data.records.filter((r) => r.studentId !== studentId);
    saveAll({ ...data, students, attendance, records });
    setDelId(null);
  }
  function moveStatus(studentId, status) {
    const students = data.students.map((s) => (s.studentId === studentId ? { ...s, status } : s));
    saveAll({ ...data, students });
  }

  return (
    <div>
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <button onClick={() => setStatusTab("active")} className="text-sm px-3 py-1.5 rounded" style={{ background: statusTab === "active" ? C.maroon : "#fff", color: statusTab === "active" ? "#fff" : C.inkText, border: `1px solid ${C.border}` }}>Active ({activeCount})</button>
        <button onClick={() => setStatusTab("inactive")} className="text-sm px-3 py-1.5 rounded" style={{ background: statusTab === "inactive" ? C.maroon : "#fff", color: statusTab === "inactive" ? "#fff" : C.inkText, border: `1px solid ${C.border}` }}>Not active ({inactiveCount})</button>
      </div>
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <div className="w-64"><SearchBox value={q} onChange={setQ} placeholder="Search name or student ID…" /></div>
        <select value={courseFilter} onChange={(e) => setCourseFilter(e.target.value)} style={{ ...inputStyle, width: "auto" }}>
          <option value="All">All programmes</option>
          {allowedCourses.map((c) => <option key={c} value={c}>{c}</option>)}
        </select>
        <span className="text-xs" style={{ color: C.slate }}>{filtered.length} of {visibleStudents.length}</span>
        <button onClick={() => setShowAdd(true)} className="ml-auto flex items-center gap-1.5 text-sm px-3 py-2 rounded" style={{ background: C.maroon, color: "#fff" }}><Icon name="plus" size={15} /> Add student</button>
      </div>

      <div className="rounded-lg overflow-hidden" style={{ background: "#fff", border: `1px solid ${C.border}` }}>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr style={{ background: C.parchmentAlt, color: C.slate }}>
                <th className="text-left px-3 py-2">Student ID</th><th className="text-left px-3 py-2">Name</th>
                <th className="text-left px-3 py-2">Programme</th><th className="text-left px-3 py-2">Sem</th>
                <th className="text-left px-3 py-2">Sec</th><th className="text-left px-3 py-2">Attendance</th>
                <th className="text-left px-3 py-2">Avg / Grade</th><th className="text-right px-3 py-2">Actions</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((s) => {
                const st = studentStats(s.studentId, data);
                const g = gradeFor(st.avg);
                return (
                  <tr key={s.studentId} style={{ borderTop: `1px solid ${C.border}` }}>
                    <td className="px-3 py-2" style={{ fontFamily: "ui-monospace", color: C.inkText }}>{s.studentId}</td>
                    <td className="px-3 py-2"><button className="text-left hover:underline" style={{ color: C.maroon }} onClick={() => setDetail(s)}>{s.name}</button></td>
                    <td className="px-3 py-2" style={{ color: C.slate }}>{s.courseCode}</td>
                    <td className="px-3 py-2">{s.semester}</td><td className="px-3 py-2">{s.section}</td>
                    <td className="px-3 py-2"><Badge color={st.attPct < 75 ? C.red : C.green} soft={st.attPct < 75 ? C.redSoft : C.greenSoft}>{st.attPct}%</Badge></td>
                    <td className="px-3 py-2">{st.totalExp ? <span>{st.avg.toFixed(1)} <Badge color={g.color} soft={C.amberSoft}>{g.label}</Badge></span> : <span style={{ color: C.slate }}>—</span>}</td>
                    <td className="px-3 py-2 text-right">
                      {delId === s.studentId ? (
                        <ConfirmInline onConfirm={() => removeStudent(s.studentId)} onCancel={() => setDelId(null)} />
                      ) : (
                        <span className="inline-flex gap-2 items-center">
                          {statusTab === "active" ? (
                            <button onClick={() => moveStatus(s.studentId, "inactive")} title="Move to not-active"><Icon name="archive" size={15} color={C.amber} /></button>
                          ) : (
                            <button onClick={() => moveStatus(s.studentId, "active")} title="Restore to active"><Icon name="inbox" size={15} color={C.green} /></button>
                          )}
                          <button onClick={() => setEditing(s)} title="Edit"><Icon name="pencil" size={15} color={C.slate} /></button>
                          {isAdmin && <button onClick={() => setDelId(s.studentId)} title="Delete permanently"><Icon name="trash" size={15} color={C.red} /></button>}
                        </span>
                      )}
                    </td>
                  </tr>
                );
              })}
              {filtered.length === 0 && <tr><td colSpan={8} className="px-3 py-6 text-center" style={{ color: C.slate }}>No students match this view.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {(showAdd || editing) && (
        <StudentForm initial={editing} existingIds={data.students.map((s) => s.studentId)} isAdmin={isAdmin} assignments={assignments}
          onCancel={() => { setShowAdd(false); setEditing(null); }} onSave={(s) => upsertStudent(s, !editing)} />
      )}
      {detail && <StudentDetail student={detail} data={data} onClose={() => setDetail(null)} />}
    </div>
  );
}

function StudentForm({ initial, existingIds, isAdmin, assignments, onCancel, onSave }) {
  const restricted = !isAdmin && assignments && assignments.length > 0;
  const defaultCombo = restricted ? assignments[0] : { courseCode: COURSES[0].code, section: "A", semester: "I" };
  const [form, setForm] = useState(initial || { studentId: "", name: "", ...defaultCombo });
  const [comboKey, setComboKey] = useState(restricted ? classKey(defaultCombo) : "");
  const [err, setErr] = useState("");

  function submit() {
    if (!form.studentId.trim() || !form.name.trim()) { setErr("Student ID and name are required."); return; }
    if (!initial && existingIds.includes(form.studentId.trim())) { setErr("This student ID already exists."); return; }
    if (restricted && !assignments.some((a) => a.courseCode === form.courseCode && a.section === form.section && a.semester === form.semester)) {
      setErr("Please choose one of your assigned classes."); return;
    }
    onSave({ ...form, studentId: form.studentId.trim(), name: form.name.trim() });
  }

  return (
    <Modal title={initial ? "Edit student" : "Add new student"} onClose={onCancel}>
      <Field label="Student ID"><input style={inputStyle} value={form.studentId} disabled={!!initial} onChange={(e) => setForm({ ...form, studentId: e.target.value })} placeholder="e.g. IU25CSE051" /></Field>
      <Field label="Full name"><input style={inputStyle} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Student's full name" /></Field>
      {restricted ? (
        <Field label="Class (from your assigned classes)">
          <select style={inputStyle} value={comboKey} onChange={(e) => {
            const combo = assignments.find((a) => classKey(a) === e.target.value);
            setComboKey(e.target.value);
            if (combo) setForm({ ...form, courseCode: combo.courseCode, section: combo.section, semester: combo.semester });
          }}>
            {assignments.map((a) => <option key={classKey(a)} value={classKey(a)}>{classLabel(a)}</option>)}
          </select>
        </Field>
      ) : (
        <div className="grid grid-cols-3 gap-3">
          <Field label="Programme"><select style={inputStyle} value={form.courseCode} onChange={(e) => setForm({ ...form, courseCode: e.target.value })}>{COURSES.map((c) => <option key={c.code} value={c.code}>{c.code}</option>)}</select></Field>
          <Field label="Semester"><select style={inputStyle} value={form.semester} onChange={(e) => setForm({ ...form, semester: e.target.value })}>{SEMESTERS.map((s) => <option key={s} value={s}>{s}</option>)}</select></Field>
          <Field label="Section"><select style={inputStyle} value={form.section} onChange={(e) => setForm({ ...form, section: e.target.value })}>{SECTIONS.map((s) => <option key={s} value={s}>{s}</option>)}</select></Field>
        </div>
      )}
      {err && <div className="text-xs mb-3" style={{ color: C.red }}>{err}</div>}
      <div className="flex justify-end gap-2 mt-2">
        <button onClick={onCancel} className="px-3 py-2 rounded text-sm" style={{ border: `1px solid ${C.border}` }}>Cancel</button>
        <button onClick={submit} className="px-3 py-2 rounded text-sm flex items-center gap-1.5" style={{ background: C.maroon, color: "#fff" }}><Icon name="save" size={14} /> Save</button>
      </div>
    </Modal>
  );
}

function StudentDetail({ student, data, onClose }) {
  const st = studentStats(student.studentId, data);
  const g = gradeFor(st.avg);
  const recs = data.records.filter((r) => r.studentId === student.studentId).sort((a, b) => a.date.localeCompare(b.date));
  const att = data.attendance.filter((a) => a.studentId === student.studentId).sort((a, b) => a.date.localeCompare(b.date));
  const course = COURSES.find((c) => c.code === student.courseCode);
  const chartData = recs.map((r) => { const exp = data.experiments.find((e) => e.id === r.experimentId); return { name: exp ? `E${exp.srNo}` : r.experimentId, value: r.marks }; });

  return (
    <Modal title={student.name} onClose={onClose} wide>
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <Icon name="user-round" size={16} color={C.maroon} />
        <span style={{ fontFamily: "ui-monospace", color: C.slate }}>{student.studentId}</span>
        <span style={{ color: C.slate }}>·</span><span style={{ color: C.slate }}>{course?.name}</span>
        <span style={{ color: C.slate }}>· Sem {student.semester} · Sec {student.section}</span>
        {student.status === "inactive" && <Badge color={C.amber} soft={C.amberSoft}>Not active</Badge>}
      </div>
      <div className="grid grid-cols-3 gap-3 mb-5">
        <StatCard icon="calendar-check" label="Attendance" value={`${st.attPct}%`} sub={`${st.sessions} sessions`} />
        <StatCard icon="flask" label="Experiments done" value={`${st.totalExp}/${data.experiments.length}`} />
        <StatCard icon="award" label="Average" value={st.totalExp ? st.avg.toFixed(1) + "/10" : "—"} sub={<Badge color={g.color} soft={C.amberSoft}>{g.label}</Badge>} />
      </div>
      {chartData.length > 0 && (
        <div className="mb-5"><h4 className="text-xs uppercase tracking-wide mb-2" style={{ color: C.slate }}>Marks by experiment</h4>
          <MiniBarChart data={chartData} domainMax={10} color={C.amber} height={160} /></div>
      )}
      <h4 className="text-xs uppercase tracking-wide mb-2" style={{ color: C.slate }}>Session history</h4>
      <div className="overflow-x-auto">
        <table className="w-full text-sm mb-2">
          <thead><tr style={{ color: C.slate }}><th className="text-left py-1">Date</th><th className="text-left py-1">Attendance</th><th className="text-left py-1">Experiment</th><th className="text-left py-1">Marks</th></tr></thead>
          <tbody>
            {att.map((a) => {
              const rec = recs.find((r) => r.date === a.date);
              const exp = rec ? data.experiments.find((e) => e.id === rec.experimentId) : null;
              return (
                <tr key={a.id} style={{ borderTop: `1px dashed ${C.border}` }}>
                  <td className="py-1">{fmtDate(a.date)}</td>
                  <td className="py-1">{a.status === "Present" && <Badge color={C.green} soft={C.greenSoft}>Present</Badge>}{a.status === "Absent" && <Badge color={C.red} soft={C.redSoft}>Absent</Badge>}{a.status === "Late" && <Badge color={C.amber} soft={C.amberSoft}>Late</Badge>}</td>
                  <td className="py-1">{exp ? exp.title : "—"}</td><td className="py-1">{rec ? `${rec.marks}/10` : "—"}</td>
                </tr>
              );
            })}
            {att.length === 0 && <tr><td colSpan={4} className="py-3 text-center" style={{ color: C.slate }}>No sessions recorded yet.</td></tr>}
          </tbody>
        </table>
      </div>
    </Modal>
  );
}
