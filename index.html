function ExperimentsView({ data, saveAll, isAdmin }) {
  const [q, setQ] = useState("");
  const [statusTab, setStatusTab] = useState("active");
  const [showAdd, setShowAdd] = useState(false);
  const [showCategories, setShowCategories] = useState(false);
  const [delId, setDelId] = useState(null);
  const categories = data.categories && data.categories.length ? data.categories : CATEGORIES;

  const filtered = data.experiments.filter((e) => (e.status || "active") === statusTab && (!q || e.title.toLowerCase().includes(q.toLowerCase()) || e.category.toLowerCase().includes(q.toLowerCase())));
  const activeCount = data.experiments.filter((e) => (e.status || "active") === "active").length;
  const inactiveCount = data.experiments.length - activeCount;

  function addExperiment(exp) {
    const srNo = data.experiments.length + 1;
    const id = `EXP${String(srNo).padStart(2, "0")}`;
    saveAll({ ...data, experiments: [...data.experiments, { id, srNo, ...exp, maxMarks: 10, status: "active" }] });
    setShowAdd(false);
  }
  function removeExperiment(id) {
    const experiments = data.experiments.filter((e) => e.id !== id).map((e, i) => ({ ...e, srNo: i + 1 }));
    const records = data.records.filter((r) => r.experimentId !== id);
    saveAll({ ...data, experiments, records });
    setDelId(null);
  }
  function moveStatus(id, status) {
    const experiments = data.experiments.map((e) => (e.id === id ? { ...e, status } : e));
    saveAll({ ...data, experiments });
  }

  return (
    <div>
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <button onClick={() => setStatusTab("active")} className="text-sm px-3 py-1.5 rounded" style={{ background: statusTab === "active" ? C.maroon : "#fff", color: statusTab === "active" ? "#fff" : C.inkText, border: `1px solid ${C.border}` }}>Active ({activeCount})</button>
        <button onClick={() => setStatusTab("inactive")} className="text-sm px-3 py-1.5 rounded" style={{ background: statusTab === "inactive" ? C.maroon : "#fff", color: statusTab === "inactive" ? "#fff" : C.inkText, border: `1px solid ${C.border}` }}>Not active ({inactiveCount})</button>
      </div>
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <div className="w-64"><SearchBox value={q} onChange={setQ} placeholder="Search experiments…" /></div>
        <span className="text-xs" style={{ color: C.slate }}>{filtered.length} of {data.experiments.length}</span>
        {isAdmin && <button onClick={() => setShowCategories(true)} className="flex items-center gap-1.5 text-sm px-3 py-2 rounded ml-auto md:ml-0" style={{ border: `1px solid ${C.border}`, color: C.inkText }}><Icon name="clipboard" size={15} /> Manage categories</button>}
        {isAdmin && <button onClick={() => setShowAdd(true)} className="flex items-center gap-1.5 text-sm px-3 py-2 rounded md:ml-auto" style={{ background: C.maroon, color: "#fff" }}><Icon name="plus" size={15} /> Add experiment</button>}
      </div>
      <div className="grid md:grid-cols-2 gap-3">
        {filtered.map((e) => {
          const recs = data.records.filter((r) => r.experimentId === e.id);
          const avg = recs.length ? recs.reduce((a, r) => a + r.marks, 0) / recs.length : 0;
          return (
            <div key={e.id} className="rounded-lg p-4" style={{ background: "#fff", border: `1px solid ${C.border}` }}>
              <div className="flex items-start justify-between gap-2">
                <div><div className="text-xs" style={{ color: C.slate, fontFamily: "ui-monospace" }}>{e.id} · Sr. No. {e.srNo}</div><div style={{ color: C.inkText, fontFamily: "Georgia, serif" }}>{e.title}</div></div>
                <span className="inline-flex gap-2 items-center">
                  {statusTab === "active" ? (
                    <button onClick={() => moveStatus(e.id, "inactive")} title="Move to not-active"><Icon name="archive" size={15} color={C.amber} /></button>
                  ) : (
                    <button onClick={() => moveStatus(e.id, "active")} title="Restore to active"><Icon name="inbox" size={15} color={C.green} /></button>
                  )}
                  {isAdmin && (delId === e.id ? <ConfirmInline onConfirm={() => removeExperiment(e.id)} onCancel={() => setDelId(null)} /> : <button onClick={() => setDelId(e.id)}><Icon name="trash" size={15} color={C.red} /></button>)}
                </span>
              </div>
              <div className="flex items-center gap-3 mt-3 text-xs" style={{ color: C.slate }}>
                <Badge color={C.maroon} soft={C.maroonSoft}>{e.category}</Badge><span>Max marks: {e.maxMarks}</span>
                <span>Completed by {recs.length} student{recs.length === 1 ? "" : "s"}</span>
                {recs.length > 0 && <span>Class avg: {avg.toFixed(1)}/10</span>}
              </div>
            </div>
          );
        })}
        {filtered.length === 0 && <div className="text-sm col-span-2" style={{ color: C.slate }}>No experiments in this view.</div>}
      </div>
      {showAdd && <ExperimentForm onCancel={() => setShowAdd(false)} onSave={addExperiment} categories={categories} />}
      {showCategories && <CategoryManager data={data} saveAll={saveAll} onClose={() => setShowCategories(false)} />}
    </div>
  );
}

function ExperimentForm({ onCancel, onSave, categories }) {
  const cats = categories && categories.length ? categories : CATEGORIES;
  const [form, setForm] = useState({ title: "", category: cats[0] });
  const [err, setErr] = useState("");
  function submit() { if (!form.title.trim()) { setErr("Please enter a title for the experiment."); return; } onSave({ title: form.title.trim(), category: form.category }); }
  return (
    <Modal title="Add new experiment" onClose={onCancel}>
      <Field label="Experiment title"><input style={inputStyle} value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} placeholder="e.g. Determination of Wavelength using Diffraction Grating" /></Field>
      <Field label="Category"><select style={inputStyle} value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>{cats.map((c) => <option key={c} value={c}>{c}</option>)}</select></Field>
      {err && <div className="text-xs mb-3" style={{ color: C.red }}>{err}</div>}
      <div className="flex justify-end gap-2 mt-2">
        <button onClick={onCancel} className="px-3 py-2 rounded text-sm" style={{ border: `1px solid ${C.border}` }}>Cancel</button>
        <button onClick={submit} className="px-3 py-2 rounded text-sm flex items-center gap-1.5" style={{ background: C.maroon, color: "#fff" }}><Icon name="save" size={14} /> Save</button>
      </div>
    </Modal>
  );
}

function CategoryManager({ data, saveAll, onClose }) {
  const categories = data.categories && data.categories.length ? data.categories : CATEGORIES;
  const [newCat, setNewCat] = useState("");
  const [editingIdx, setEditingIdx] = useState(null);
  const [editVal, setEditVal] = useState("");
  const [err, setErr] = useState("");

  function countUsing(name) { return data.experiments.filter((e) => e.category === name).length; }

  function addCategory() {
    const name = newCat.trim();
    if (!name) return;
    if (categories.some((c) => c.toLowerCase() === name.toLowerCase())) { setErr("That category already exists."); return; }
    saveAll({ ...data, categories: [...categories, name] });
    setNewCat(""); setErr("");
  }
  function startEdit(i) { setEditingIdx(i); setEditVal(categories[i]); setErr(""); }
  function cancelEdit() { setEditingIdx(null); setErr(""); }
  function saveEdit(i) {
    const name = editVal.trim();
    if (!name) { setErr("Category name can't be empty."); return; }
    if (categories.some((c, j) => j !== i && c.toLowerCase() === name.toLowerCase())) { setErr("That category already exists."); return; }
    const oldName = categories[i];
    const nextCategories = categories.map((c, j) => (j === i ? name : c));
    const experiments = data.experiments.map((e) => (e.category === oldName ? { ...e, category: name } : e));
    saveAll({ ...data, categories: nextCategories, experiments });
    setEditingIdx(null); setErr("");
  }
  function removeCategory(i) {
    const name = categories[i];
    const used = countUsing(name);
    if (used > 0) { setErr(`"${name}" is used by ${used} experiment${used === 1 ? "" : "s"} — move ${used === 1 ? "it" : "them"} to another category first.`); return; }
    if (categories.length <= 1) { setErr("You need to keep at least one category."); return; }
    saveAll({ ...data, categories: categories.filter((_, j) => j !== i) });
    setErr("");
  }

  return (
    <Modal title="Manage experiment categories" onClose={onClose}>
      <div className="mb-4">
        {categories.map((c, i) => (
          <div key={c} className="flex items-center gap-2 mb-2">
            {editingIdx === i ? (
              <>
                <input style={{ ...inputStyle, flex: 1 }} value={editVal} onChange={(e) => setEditVal(e.target.value)} autoFocus onKeyDown={(e) => e.key === "Enter" && saveEdit(i)} />
                <button onClick={() => saveEdit(i)} title="Save" className="px-2 py-1.5 rounded" style={{ background: C.maroon, color: "#fff" }}><Icon name="save" size={13} /></button>
                <button onClick={cancelEdit} title="Cancel" className="px-2 py-1.5 rounded" style={{ border: `1px solid ${C.border}` }}><Icon name="x" size={13} /></button>
              </>
            ) : (
              <>
                <div className="flex-1 text-sm" style={{ color: C.inkText }}>{c}</div>
                <span className="text-xs" style={{ color: C.slate }}>{countUsing(c)} exp.</span>
                <button onClick={() => startEdit(i)} title="Rename"><Icon name="pencil" size={14} color={C.slate} /></button>
                <button onClick={() => removeCategory(i)} title="Remove"><Icon name="trash" size={14} color={C.red} /></button>
              </>
            )}
          </div>
        ))}
      </div>
      {err && <div className="text-xs mb-3" style={{ color: C.red }}>{err}</div>}
      <div className="flex items-center gap-2 pt-3" style={{ borderTop: `1px solid ${C.border}` }}>
        <input style={{ ...inputStyle, flex: 1 }} value={newCat} onChange={(e) => setNewCat(e.target.value)} placeholder="New category name" onKeyDown={(e) => e.key === "Enter" && addCategory()} />
        <button onClick={addCategory} className="px-3 py-2 rounded text-sm flex items-center gap-1.5" style={{ background: C.maroon, color: "#fff" }}><Icon name="plus" size={14} /> Add</button>
      </div>
      <div className="flex justify-end mt-4">
        <button onClick={onClose} className="px-3 py-2 rounded text-sm" style={{ border: `1px solid ${C.border}` }}>Done</button>
      </div>
    </Modal>
  );
}

/* ================================================================== */
/* Bulk Import — read an Excel workbook (Student data + Experiment      */
/* data sheets) and add everything in a single saveAll() call, instead  */
/* of one form submission per row.                                     */
/* ================================================================== */
function normHeader(h) {
  return String(h == null ? "" : h).toLowerCase().replace(/[.\s_-]+/g, " ").trim();
}
const STUDENT_HEADER_MAP = {
  "student id": "studentId", "id": "studentId", "roll no": "studentId", "roll number": "studentId",
  "registration no": "studentId", "registration number": "studentId", "enrollment no": "studentId", "enrolment no": "studentId",
  "student name": "name", "name": "name",
  "course & branch": "course", "course and branch": "course", "course": "course", "branch": "course",
  "programme": "course", "program": "course", "course code": "course",
  "semester": "semester", "sem": "semester",
  "section": "section", "sec": "section",
};
const EXPERIMENT_HEADER_MAP = {
  "experiment title": "title", "title": "title", "experiment name": "title", "name": "title",
  "category": "category",
  "max marks": "maxMarks", "max. marks": "maxMarks", "maximum marks": "maxMarks", "marks": "maxMarks",
};
function matchCourseCode(raw) {
  const v = String(raw == null ? "" : raw).trim();
  if (!v) return null;
  const upper = v.toUpperCase();
  let hit = COURSES.find((c) => c.code.toUpperCase() === upper);
  if (hit) return hit.code;
  hit = COURSES.find((c) => new RegExp(`\\b${c.code}\\b`, "i").test(v));
  if (hit) return hit.code;
  hit = COURSES.find((c) => v.toLowerCase().includes(c.name.toLowerCase()) || c.name.toLowerCase().includes(v.toLowerCase()));
  return hit ? hit.code : null;
}
function normalizeSemester(raw) {
  const v = String(raw == null ? "" : raw).trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (["I", "1", "1ST", "SEM1", "SEMESTERI", "SEMESTER1"].includes(v)) return "I";
  if (["II", "2", "2ND", "SEM2", "SEMESTERII", "SEMESTER2"].includes(v)) return "II";
  return null;
}
function normalizeSection(raw) {
  const v = String(raw == null ? "" : raw).trim().toUpperCase();
  return SECTIONS.includes(v) ? v : null;
}
// Turns a worksheet into { field: value } rows using the header-synonym map.
// Ignores columns it doesn't recognise (e.g. "S.No.") and skips blank rows.
function sheetToFieldRows(ws, headerMap) {
  const grid = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false });
  if (!grid.length) return [];
  const headerRow = grid[0];
  const colToField = {};
  headerRow.forEach((h, i) => { const f = headerMap[normHeader(h)]; if (f) colToField[i] = f; });
  const rows = [];
  for (let r = 1; r < grid.length; r++) {
    const raw = grid[r];
    if (!raw || raw.every((c) => String(c == null ? "" : c).trim() === "")) continue;
    const fields = {};
    Object.entries(colToField).forEach(([i, f]) => { fields[f] = raw[Number(i)]; });
    rows.push(fields);
  }
  return rows;
}
function findSheet(workbook, nameContains) {
  const name = workbook.SheetNames.find((n) => n.toLowerCase().includes(nameContains));
  return name ? workbook.Sheets[name] : null;
}

function BulkImportView({ data, saveAll, showToast }) {
  const [busy, setBusy] = useState(false);
  const [parseErr, setParseErr] = useState("");
  const [result, setResult] = useState(null); // { students: [...], experiments: [...] }
  const [importing, setImporting] = useState(false);
  const [done, setDone] = useState(null); // { studentsAdded, experimentsAdded }
  const fileInputRef = useRef(null);

  function reset() { setResult(null); setParseErr(""); setDone(null); if (fileInputRef.current) fileInputRef.current.value = ""; }

  function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setBusy(true); setParseErr(""); setResult(null); setDone(null);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: "array" });
        const studentSheet = findSheet(wb, "student") || wb.Sheets[wb.SheetNames[0]];
        const expSheet = findSheet(wb, "experiment") || (wb.SheetNames[1] ? wb.Sheets[wb.SheetNames[1]] : null);

        const existingStudentIds = new Set(data.students.map((s) => s.studentId.toLowerCase()));
        const existingExpTitles = new Set(data.experiments.map((x) => x.title.toLowerCase()));
        const existingCategories = new Set((data.categories && data.categories.length ? data.categories : CATEGORIES).map((c) => c.toLowerCase()));

        const seenStudentIds = new Set();
        const students = studentSheet ? sheetToFieldRows(studentSheet, STUDENT_HEADER_MAP).map((f, i) => {
          const errors = [];
          const studentId = String(f.studentId || "").trim();
          const name = String(f.name || "").trim();
          const courseCode = matchCourseCode(f.course);
          const semester = normalizeSemester(f.semester);
          const section = normalizeSection(f.section);
          if (!studentId) errors.push("Missing Student ID");
          if (!name) errors.push("Missing name");
          if (!courseCode) errors.push(`Unrecognized programme "${f.course || ""}" (expected ${COURSES.map((c) => c.code).join("/")})`);
          if (!semester) errors.push(`Unrecognized semester "${f.semester || ""}" (expected I or II)`);
          if (!section) errors.push(`Unrecognized section "${f.section || ""}" (expected ${SECTIONS.join("/")})`);
          let duplicate = false;
          if (studentId) {
            const key = studentId.toLowerCase();
            if (existingStudentIds.has(key) || seenStudentIds.has(key)) duplicate = true;
            else seenStudentIds.add(key);
          }
          return { row: i + 2, studentId, name, courseCode, semester, section, errors, duplicate };
        }) : [];

        const seenExpTitles = new Set();
        const experiments = expSheet ? sheetToFieldRows(expSheet, EXPERIMENT_HEADER_MAP).map((f, i) => {
          const errors = [];
          const title = String(f.title || "").trim();
          const category = String(f.category || "").trim();
          if (!title) errors.push("Missing experiment title");
          if (!category) errors.push("Missing category");
          let maxMarks = Number(f.maxMarks);
          if (!f.maxMarks || isNaN(maxMarks) || maxMarks <= 0) maxMarks = 10;
          let duplicate = false;
          if (title) {
            const key = title.toLowerCase();
            if (existingExpTitles.has(key) || seenExpTitles.has(key)) duplicate = true;
            else seenExpTitles.add(key);
          }
          const newCategory = !!category && !existingCategories.has(category.toLowerCase());
          return { row: i + 2, title, category, maxMarks, errors, duplicate, newCategory };
        }) : [];

        if (!studentSheet && !expSheet) setParseErr("Couldn't find a \"Student data\" or \"Experiment data\" sheet in this workbook.");
        setResult({ students, experiments });
      } catch (err) {
        setParseErr("Couldn't read that file — please make sure it's a valid .xlsx file. (" + err.message + ")");
      } finally {
        setBusy(false);
      }
    };
    reader.onerror = () => { setBusy(false); setParseErr("Couldn't read that file."); };
    reader.readAsArrayBuffer(file);
  }

  function commitImport() {
    if (!result) return;
    setImporting(true);
    const validStudents = result.students.filter((s) => s.errors.length === 0 && !s.duplicate);
    const validExperiments = result.experiments.filter((e) => e.errors.length === 0 && !e.duplicate);

    const newStudents = validStudents.map((s) => ({
      studentId: s.studentId, name: s.name, courseCode: s.courseCode, semester: s.semester, section: s.section,
      joined: new Date().toISOString().slice(0, 10), status: "active",
    }));

    let nextSrNo = data.experiments.length;
    const newExperiments = validExperiments.map((e) => {
      nextSrNo += 1;
      return { id: `EXP${String(nextSrNo).padStart(2, "0")}`, srNo: nextSrNo, title: e.title, category: e.category, maxMarks: e.maxMarks, status: "active" };
    });

    const baseCategories = data.categories && data.categories.length ? data.categories : CATEGORIES;
    const newCategoryNames = Array.from(new Set(validExperiments.filter((e) => e.newCategory).map((e) => e.category)));
    const categories = [...baseCategories, ...newCategoryNames.filter((c) => !baseCategories.some((b) => b.toLowerCase() === c.toLowerCase()))];

    saveAll({ ...data, students: [...data.students, ...newStudents], experiments: [...data.experiments, ...newExperiments], categories });
    setDone({ studentsAdded: newStudents.length, experimentsAdded: newExperiments.length });
    setImporting(false);
    showToast(`Imported ${newStudents.length} students and ${newExperiments.length} experiments`);
  }

  function Summary({ label, rows }) {
    const valid = rows.filter((r) => r.errors.length === 0 && !r.duplicate).length;
    const dup = rows.filter((r) => r.duplicate).length;
    const bad = rows.filter((r) => r.errors.length > 0).length;
    return (
      <div className="flex flex-wrap items-center gap-3 text-xs mb-2">
        <span style={{ color: C.inkText }} className="font-semibold">{label}</span>
        <Badge color={C.green} soft={C.greenSoft}>{valid} ready</Badge>
        {dup > 0 && <Badge color={C.amber} soft={C.amberSoft}>{dup} duplicate — skipped</Badge>}
        {bad > 0 && <Badge color={C.red} soft={C.redSoft}>{bad} error — skipped</Badge>}
        <span style={{ color: C.slate }}>{rows.length} rows read</span>
      </div>
    );
  }

  function RowsTable({ kind, rows }) {
    if (!rows.length) return <div className="text-xs mb-4" style={{ color: C.slate }}>No "{kind === "students" ? "Student data" : "Experiment data"}" rows found.</div>;
    return (
      <div className="rounded-lg overflow-hidden mb-5" style={{ border: `1px solid ${C.border}`, maxHeight: "260px", overflowY: "auto" }}>
        <table className="w-full text-xs">
          <thead style={{ position: "sticky", top: 0 }}>
            <tr style={{ background: C.parchmentAlt, color: C.slate }}>
              <th className="text-left px-2 py-1.5">Row</th>
              {kind === "students" ? (
                <><th className="text-left px-2 py-1.5">Student ID</th><th className="text-left px-2 py-1.5">Name</th><th className="text-left px-2 py-1.5">Prog.</th><th className="text-left px-2 py-1.5">Sem</th><th className="text-left px-2 py-1.5">Sec</th></>
              ) : (
                <><th className="text-left px-2 py-1.5">Title</th><th className="text-left px-2 py-1.5">Category</th><th className="text-left px-2 py-1.5">Max</th></>
              )}
              <th className="text-left px-2 py-1.5">Status</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r) => (
              <tr key={r.row} style={{ borderTop: `1px solid ${C.border}`, opacity: r.duplicate || r.errors.length ? 0.65 : 1 }}>
                <td className="px-2 py-1.5" style={{ color: C.slate }}>{r.row}</td>
                {kind === "students" ? (
                  <><td className="px-2 py-1.5" style={{ fontFamily: "ui-monospace" }}>{r.studentId || "—"}</td><td className="px-2 py-1.5">{r.name || "—"}</td><td className="px-2 py-1.5">{r.courseCode || "—"}</td><td className="px-2 py-1.5">{r.semester || "—"}</td><td className="px-2 py-1.5">{r.section || "—"}</td></>
                ) : (
                  <><td className="px-2 py-1.5">{r.title || "—"}</td><td className="px-2 py-1.5">{r.category || "—"}{r.newCategory ? " (new)" : ""}</td><td className="px-2 py-1.5">{r.maxMarks}</td></>
                )}
                <td className="px-2 py-1.5">
                  {r.errors.length > 0 ? <span style={{ color: C.red }}>{r.errors.join("; ")}</span>
                    : r.duplicate ? <span style={{ color: C.amber }}>Already exists — skipped</span>
                    : <span style={{ color: C.green }}>Ready</span>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  }

  const totalReady = result ? result.students.filter((s) => !s.errors.length && !s.duplicate).length + result.experiments.filter((e) => !e.errors.length && !e.duplicate).length : 0;

  return (
    <div>
      <div className="rounded-lg p-4 mb-5" style={{ background: "#fff", border: `1px solid ${C.border}` }}>
        <div style={{ color: C.inkText, fontFamily: "Georgia, serif" }} className="mb-1">Import students &amp; experiments from Excel</div>
        <div className="text-xs mb-3" style={{ color: C.slate }}>
          Upload one workbook with a "Student data" sheet (Student ID, Student Name, Course &amp; Branch, Semester, Section) and/or an
          "Experiment data" sheet (Experiment Title, Category, Max. Marks). Everything is added in a single save — no need to add records one at a time.
        </div>
        <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleFile}
          className="text-sm" style={{ color: C.inkText }} />
        {busy && <div className="text-xs mt-2 flex items-center gap-1.5" style={{ color: C.slate }}><Icon name="loader" size={13} /> Reading file…</div>}
        {parseErr && <div className="text-xs mt-2" style={{ color: C.red }}>{parseErr}</div>}
      </div>

      {result && !done && (
        <div className="rounded-lg p-4 mb-5" style={{ background: "#fff", border: `1px solid ${C.border}` }}>
          <Summary label="Students" rows={result.students} />
          <RowsTable kind="students" rows={result.students} />
          <Summary label="Experiments" rows={result.experiments} />
          <RowsTable kind="experiments" rows={result.experiments} />
          <div className="flex items-center gap-2">
            <button onClick={commitImport} disabled={importing || totalReady === 0}
              className="flex items-center gap-1.5 text-sm px-3 py-2 rounded" style={{ background: C.maroon, color: "#fff", opacity: importing || totalReady === 0 ? 0.6 : 1 }}>
              <Icon name="save" size={14} /> {importing ? "Importing…" : `Import ${totalReady} record${totalReady === 1 ? "" : "s"}`}
            </button>
            <button onClick={reset} className="px-3 py-2 rounded text-sm" style={{ border: `1px solid ${C.border}` }}>Cancel</button>
          </div>
        </div>
      )}

      {done && (
        <div className="rounded-lg p-4" style={{ background: C.greenSoft, border: `1px solid ${C.border}` }}>
          <div className="flex items-center gap-1.5 mb-1" style={{ color: C.green }}><Icon name="check-circle" size={15} /> Import complete</div>
          <div className="text-sm" style={{ color: C.inkText }}>Added {done.studentsAdded} student{done.studentsAdded === 1 ? "" : "s"} and {done.experimentsAdded} experiment{done.experimentsAdded === 1 ? "" : "s"}.</div>
          <button onClick={reset} className="mt-3 flex items-center gap-1.5 text-sm px-3 py-2 rounded" style={{ border: `1px solid ${C.border}` }}><Icon name="upload" size={14} /> Import another file</button>
        </div>
      )}
    </div>
  );
}

/* ================================================================== */
/* Attendance                                                           */
/* ================================================================== */
function AttendanceView({ data, saveAll, assignments }) {
  const today = new Date().toISOString().slice(0, 10);
  const [date, setDate] = useState(today);
  const [period, setPeriod] = useState("1");
  const [courseFilter, setCourseFilter] = useState("All");
  const [sectionFilter, setSectionFilter] = useState("All");
  const [statusMap, setStatusMap] = useState({});
  const [saved, setSaved] = useState(false);

  const allowedCourses = assignments ? Array.from(new Set(assignments.map((a) => a.courseCode))) : COURSES.map((c) => c.code);
  const allowedSections = assignments ? Array.from(new Set(assignments.map((a) => a.section))) : SECTIONS;

  const students = data.students.filter((s) =>
    (s.status || "active") === "active" &&
    studentMatchesAssignments(s, assignments) &&
    (courseFilter === "All" || s.courseCode === courseFilter) &&
    (sectionFilter === "All" || s.section === sectionFilter));

  useEffect(() => {
    const map = {};
    students.forEach((s) => { const existing = data.attendance.find((a) => a.studentId === s.studentId && a.date === date && a.period === period); map[s.studentId] = existing ? existing.status : "Present"; });
    setStatusMap(map); setSaved(false);
    // eslint-disable-next-line
  }, [date, period, courseFilter, sectionFilter]);

  function setStatus(id, status) { setStatusMap((m) => ({ ...m, [id]: status })); setSaved(false); }
  function markAll(status) { const map = {}; students.forEach((s) => { map[s.studentId] = status; }); setStatusMap(map); setSaved(false); }
  function save() {
    const others = data.attendance.filter((a) => !(a.date === date && a.period === period && students.find((s) => s.studentId === a.studentId)));
    const fresh = students.map((s) => ({ id: `A-${date}-${period}-${s.studentId}`, studentId: s.studentId, date, period, status: statusMap[s.studentId] || "Present" }));
    saveAll({ ...data, attendance: [...others, ...fresh] });
    setSaved(true);
  }
  const presentCount = Object.values(statusMap).filter((v) => v !== "Absent").length;

  if (assignments && assignments.length === 0) {
    return <div className="text-sm p-6 rounded-lg" style={{ background: "#fff", border: `1px solid ${C.border}`, color: C.slate }}>No classes have been assigned to you yet. Ask the administrator to assign a programme, semester and section before taking attendance.</div>;
  }

  return (
    <div>
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <Field label="Date"><input type="date" style={inputStyle} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
        <Field label="Period"><select style={inputStyle} value={period} onChange={(e) => setPeriod(e.target.value)}>{PERIODS.map((p) => <option key={p} value={p}>Period {p}</option>)}</select></Field>
        <Field label="Programme"><select style={inputStyle} value={courseFilter} onChange={(e) => setCourseFilter(e.target.value)}><option value="All">All</option>{allowedCourses.map((c) => <option key={c} value={c}>{c}</option>)}</select></Field>
        <Field label="Section"><select style={inputStyle} value={sectionFilter} onChange={(e) => setSectionFilter(e.target.value)}><option value="All">All</option>{allowedSections.map((s) => <option key={s} value={s}>{s}</option>)}</select></Field>
        <div className="ml-auto flex items-center gap-2">
          <button onClick={() => markAll("Present")} className="text-xs px-3 py-2 rounded" style={{ border: `1px solid ${C.border}`, background: "#fff" }}>Mark all present</button>
          <button onClick={save} className="flex items-center gap-1.5 text-sm px-3 py-2 rounded" style={{ background: C.maroon, color: "#fff" }}><Icon name="save" size={14} /> Save attendance</button>
        </div>
      </div>
      <div className="text-xs mb-3" style={{ color: C.slate }}>{students.length} students · {presentCount} marked present {saved && <span style={{ color: C.green }}>· Saved</span>}</div>
      <div className="rounded-lg overflow-hidden" style={{ background: "#fff", border: `1px solid ${C.border}` }}>
        <div className="overflow-x-auto" style={{ maxHeight: 480, overflowY: "auto" }}>
          <table className="w-full text-sm">
            <thead style={{ position: "sticky", top: 0 }}><tr style={{ background: C.parchmentAlt, color: C.slate }}><th className="text-left px-3 py-2">Student ID</th><th className="text-left px-3 py-2">Name</th><th className="text-left px-3 py-2">Prog/Sec</th><th className="text-left px-3 py-2">Status</th></tr></thead>
            <tbody>
              {students.map((s) => (
                <tr key={s.studentId} style={{ borderTop: `1px solid ${C.border}` }}>
                  <td className="px-3 py-2" style={{ fontFamily: "ui-monospace" }}>{s.studentId}</td>
                  <td className="px-3 py-2">{s.name}</td><td className="px-3 py-2" style={{ color: C.slate }}>{s.courseCode} / {s.section}</td>
                  <td className="px-3 py-2">
                    <div className="flex gap-1">
                      {ATT_STATUS.map((st) => {
                        const active = statusMap[s.studentId] === st;
                        const col = st === "Present" ? C.green : st === "Absent" ? C.red : C.amber;
                        const soft = st === "Present" ? C.greenSoft : st === "Absent" ? C.redSoft : C.amberSoft;
                        return (
                          <button key={st} onClick={() => setStatus(s.studentId, st)} className="text-xs px-2 py-1 rounded flex items-center gap-1" style={{ background: active ? col : soft, color: active ? "#fff" : col }}>
                            {st === "Present" && <Icon name="check-circle" size={12} />}{st === "Absent" && <Icon name="x-circle" size={12} />}{st === "Late" && <Icon name="clock" size={12} />}{st}
                          </button>
                        );
                      })}
                    </div>
                  </td>
                </tr>
              ))}
              {students.length === 0 && <tr><td colSpan={4} className="px-3 py-6 text-center" style={{ color: C.slate }}>No active students match this filter.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ================================================================== */
/* Evaluation                                                           */
/* ================================================================== */
function EvaluationView({ data, saveAll, assignments }) {
  const today = new Date().toISOString().slice(0, 10);
  const activeExperiments = data.experiments.filter((e) => (e.status || "active") === "active");
  const [expId, setExpId] = useState(activeExperiments[0]?.id || "");
  const [date, setDate] = useState(today);
  const [courseFilter, setCourseFilter] = useState("All");
  const [sectionFilter, setSectionFilter] = useState("All");
  const [marksMap, setMarksMap] = useState({});
  const [saved, setSaved] = useState(false);

  const allowedCourses = assignments ? Array.from(new Set(assignments.map((a) => a.courseCode))) : COURSES.map((c) => c.code);
  const allowedSections = assignments ? Array.from(new Set(assignments.map((a) => a.section))) : SECTIONS;

  const students = data.students.filter((s) =>
    (s.status || "active") === "active" &&
    studentMatchesAssignments(s, assignments) &&
    (courseFilter === "All" || s.courseCode === courseFilter) &&
    (sectionFilter === "All" || s.section === sectionFilter));

  useEffect(() => {
    const map = {};
    students.forEach((s) => { const rec = data.records.find((r) => r.studentId === s.studentId && r.experimentId === expId); map[s.studentId] = rec ? rec.marks : ""; });
    setMarksMap(map); setSaved(false);
    // eslint-disable-next-line
  }, [expId, courseFilter, sectionFilter]);

  function setMarks(id, val) {
    let v = val; if (v !== "") v = Math.max(0, Math.min(10, Number(v)));
    setMarksMap((m) => ({ ...m, [id]: v })); setSaved(false);
  }
  function save() {
    const relevantIds = new Set(students.map((s) => s.studentId));
    const others = data.records.filter((r) => !(r.experimentId === expId && relevantIds.has(r.studentId)));
    const fresh = students.filter((s) => marksMap[s.studentId] !== "" && marksMap[s.studentId] !== undefined && marksMap[s.studentId] !== null)
      .map((s) => ({ id: `R-${expId}-${s.studentId}`, studentId: s.studentId, experimentId: expId, date, marks: Number(marksMap[s.studentId]), remarks: "" }));
    saveAll({ ...data, records: [...others, ...fresh] });
    setSaved(true);
  }

  const exp = data.experiments.find((e) => e.id === expId);
  const enteredCount = Object.values(marksMap).filter((v) => v !== "" && v !== undefined && v !== null).length;
  const avgEntered = enteredCount ? Object.values(marksMap).filter((v) => v !== "" && v !== undefined).reduce((a, b) => a + Number(b), 0) / enteredCount : 0;

  if (assignments && assignments.length === 0) {
    return <div className="text-sm p-6 rounded-lg" style={{ background: "#fff", border: `1px solid ${C.border}`, color: C.slate }}>No classes have been assigned to you yet. Ask the administrator to assign a programme, semester and section before entering marks.</div>;
  }
  if (activeExperiments.length === 0) {
    return <div className="text-sm p-6 rounded-lg" style={{ background: "#fff", border: `1px solid ${C.border}`, color: C.slate }}>There are no active experiments to evaluate. Restore one from the Experiments tab.</div>;
  }

  return (
    <div>
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <Field label="Experiment"><select style={{ ...inputStyle, minWidth: 260 }} value={expId} onChange={(e) => setExpId(e.target.value)}>{activeExperiments.map((e) => <option key={e.id} value={e.id}>Sr.{e.srNo} — {e.title}</option>)}</select></Field>
        <Field label="Date"><input type="date" style={inputStyle} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
        <Field label="Programme"><select style={inputStyle} value={courseFilter} onChange={(e) => setCourseFilter(e.target.value)}><option value="All">All</option>{allowedCourses.map((c) => <option key={c} value={c}>{c}</option>)}</select></Field>
        <Field label="Section"><select style={inputStyle} value={sectionFilter} onChange={(e) => setSectionFilter(e.target.value)}><option value="All">All</option>{allowedSections.map((s) => <option key={s} value={s}>{s}</option>)}</select></Field>
        <button onClick={save} className="ml-auto flex items-center gap-1.5 text-sm px-3 py-2 rounded" style={{ background: C.maroon, color: "#fff" }}><Icon name="save" size={14} /> Save marks</button>
      </div>
      <div className="text-xs mb-3" style={{ color: C.slate }}>{exp && <span>{exp.category} · Max marks {exp.maxMarks} · </span>}{enteredCount} of {students.length} entered {enteredCount > 0 && `· avg ${avgEntered.toFixed(1)}/10`} {saved && <span style={{ color: C.green }}>· Saved</span>}</div>
      <div className="rounded-lg overflow-hidden" style={{ background: "#fff", border: `1px solid ${C.border}` }}>
        <div className="overflow-x-auto" style={{ maxHeight: 480, overflowY: "auto" }}>
          <table className="w-full text-sm">
            <thead style={{ position: "sticky", top: 0 }}><tr style={{ background: C.parchmentAlt, color: C.slate }}><th className="text-left px-3 py-2">Student ID</th><th className="text-left px-3 py-2">Name</th><th className="text-left px-3 py-2">Prog/Sec</th><th className="text-left px-3 py-2">Marks (out of 10)</th></tr></thead>
            <tbody>
              {students.map((s) => (
                <tr key={s.studentId} style={{ borderTop: `1px solid ${C.border}` }}>
                  <td className="px-3 py-2" style={{ fontFamily: "ui-monospace" }}>{s.studentId}</td>
                  <td className="px-3 py-2">{s.name}</td><td className="px-3 py-2" style={{ color: C.slate }}>{s.courseCode} / {s.section}</td>
                  <td className="px-3 py-2"><input type="number" min="0" max="10" step="0.5" value={marksMap[s.studentId] ?? ""} onChange={(e) => setMarks(s.studentId, e.target.value)} style={{ ...inputStyle, width: 90 }} placeholder="—" /></td>
                </tr>
              ))}
              {students.length === 0 && <tr><td colSpan={4} className="px-3 py-6 text-center" style={{ color: C.slate }}>No active students match this filter.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* Reports                                                               */
/* ================================================================== */
function ReportsView({ data, visibleStudents }) {
  const [q, setQ] = useState("");
  const [selected, setSelected] = useState(visibleStudents[0]?.studentId || "");
  const [sortBy, setSortBy] = useState("avg");

  const rows = useMemo(() => {
    const list = visibleStudents.map((s) => ({ ...s, ...studentStats(s.studentId, data) }));
    list.sort((a, b) => (sortBy === "avg" ? b.avg - a.avg : sortBy === "att" ? b.attPct - a.attPct : a.name.localeCompare(b.name)));
    return list.filter((s) => !q || s.name.toLowerCase().includes(q.toLowerCase()) || s.studentId.toLowerCase().includes(q.toLowerCase()));
  }, [visibleStudents, data, q, sortBy]);

  const student = visibleStudents.find((s) => s.studentId === selected);

  return (
    <div className="grid lg:grid-cols-2 gap-5">
      <div>
        <div className="flex items-center gap-3 mb-3">
          <div className="w-56"><SearchBox value={q} onChange={setQ} placeholder="Search…" /></div>
          <select style={inputStyle} value={sortBy} onChange={(e) => setSortBy(e.target.value)}><option value="avg">Sort: average</option><option value="att">Sort: attendance</option><option value="name">Sort: name</option></select>
        </div>
        <div className="rounded-lg overflow-hidden" style={{ background: "#fff", border: `1px solid ${C.border}` }}>
          <div style={{ maxHeight: 520, overflowY: "auto" }}>
            <table className="w-full text-sm">
              <thead style={{ position: "sticky", top: 0 }}><tr style={{ background: C.parchmentAlt, color: C.slate }}><th className="text-left px-3 py-2">Name</th><th className="text-left px-3 py-2">Attendance</th><th className="text-left px-3 py-2">Avg</th><th className="text-left px-3 py-2">Grade</th></tr></thead>
              <tbody>
                {rows.map((s) => {
                  const g = gradeFor(s.avg);
                  const active = s.studentId === selected;
                  return (
                    <tr key={s.studentId} onClick={() => setSelected(s.studentId)} style={{ borderTop: `1px solid ${C.border}`, cursor: "pointer", background: active ? C.parchmentAlt : "transparent" }}>
                      <td className="px-3 py-2"><div className="flex items-center gap-1.5">{s.name}{s.status === "inactive" && <Badge color={C.amber} soft={C.amberSoft}>Not active</Badge>}</div><div className="text-xs" style={{ color: C.slate, fontFamily: "ui-monospace" }}>{s.studentId}</div></td>
                      <td className="px-3 py-2">{s.attPct}%</td><td className="px-3 py-2">{s.totalExp ? s.avg.toFixed(1) : "—"}</td><td className="px-3 py-2"><Badge color={g.color} soft={C.amberSoft}>{g.label}</Badge></td>
                    </tr>
                  );
                })}
                {rows.length === 0 && <tr><td colSpan={4} className="px-3 py-6 text-center" style={{ color: C.slate }}>No students in scope.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div>{student ? <ReportCard student={student} data={data} /> : <div style={{ color: C.slate }}>Select a student to view their report card.</div>}</div>
    </div>
  );
}

function ReportCard({ student, data }) {
  const st = studentStats(student.studentId, data);
  const g = gradeFor(st.avg);
  const course = COURSES.find((c) => c.code === student.courseCode);
  const recs = data.records.filter((r) => r.studentId === student.studentId).sort((a, b) => a.date.localeCompare(b.date));
  const presentSessions = Math.round((st.attPct / 100) * st.sessions);

  return (
    <div className="rounded-lg p-5" style={{ background: "#fff", border: `1px solid ${C.border}` }}>
      <div className="pb-3 mb-4" style={{ borderBottom: `2px solid ${C.maroon}` }}>
        <div className="text-xs uppercase tracking-wide" style={{ color: C.slate }}>Laboratory Report Card</div>
        <h2 style={{ fontFamily: "Georgia, serif", color: C.maroon, margin: "2px 0" }}>{student.name}</h2>
        <div className="text-sm" style={{ color: C.slate }}>{student.studentId} · {course?.name} · Sem {student.semester} · Sec {student.section}</div>
      </div>
      <div className="grid grid-cols-2 gap-4 mb-4">
        <div className="flex items-center gap-3">
          <MiniDonut present={presentSessions} total={st.sessions || 1} size={90} />
          <div><div className="text-2xl" style={{ color: C.inkText, fontFamily: "Georgia, serif" }}>{st.attPct}%</div><div className="text-xs" style={{ color: C.slate }}>Attendance · {st.sessions} sessions</div></div>
        </div>
        <div>
          <div className="text-2xl" style={{ color: C.inkText, fontFamily: "Georgia, serif" }}>{st.totalExp ? st.avg.toFixed(1) : "—"}/10 <Badge color={g.color} soft={C.amberSoft}>{g.label}</Badge></div>
          <div className="text-xs" style={{ color: C.slate }}>Overall average · {st.totalExp}/{data.experiments.length} experiments completed</div>
        </div>
      </div>
      <h4 className="text-xs uppercase tracking-wide mb-2" style={{ color: C.slate }}>Experiment-wise marks</h4>
      <div className="overflow-y-auto" style={{ maxHeight: 260 }}>
        <table className="w-full text-sm">
          <thead><tr style={{ color: C.slate }}><th className="text-left py-1">Sr.</th><th className="text-left py-1">Experiment</th><th className="text-left py-1">Date</th><th className="text-left py-1">Marks</th></tr></thead>
          <tbody>
            {recs.map((r) => {
              const exp = data.experiments.find((e) => e.id === r.experimentId);
              return <tr key={r.id} style={{ borderTop: `1px dashed ${C.border}` }}><td className="py-1">{exp?.srNo}</td><td className="py-1">{exp?.title}</td><td className="py-1">{fmtDate(r.date)}</td><td className="py-1">{r.marks}/10</td></tr>;
            })}
            {recs.length === 0 && <tr><td colSpan={4} className="py-3 text-center" style={{ color: C.slate }}>No experiments recorded yet.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ================================================================== */
/* Teachers (administrator only)                                       */
/* ================================================================== */
function TeachersView({ auth, saveAuth }) {
  const [showAdd, setShowAdd] = useState(false);
  const [editing, setEditing] = useState(null);
  const [resetting, setResetting] = useState(null);
  const [delUser, setDelUser] = useState(null);
  const [justCreated, setJustCreated] = useState(null);

  function addTeacher(t) {
    saveAuth({ ...auth, teachers: [...auth.teachers, t] });
    setShowAdd(false);
    setJustCreated(t);
  }
  function updateTeacher(username, patch) {
    saveAuth({ ...auth, teachers: auth.teachers.map((t) => (t.username === username ? { ...t, ...patch } : t)) });
    setEditing(null);
  }
  function removeTeacher(username) {
    saveAuth({ ...auth, teachers: auth.teachers.filter((t) => t.username !== username) });
    setDelUser(null);
  }
  async function resetPassword(username, newPw) {
    const hash = await hashPassword(newPw);
    saveAuth({ ...auth, teachers: auth.teachers.map((t) => (t.username === username ? { ...t, passwordHash: hash } : t)) });
  }

  return (
    <div>
      <div className="flex items-center gap-3 mb-4">
        <span className="text-xs" style={{ color: C.slate }}>{auth.teachers.length} teacher account{auth.teachers.length === 1 ? "" : "s"}</span>
        <button onClick={() => setShowAdd(true)} className="ml-auto flex items-center gap-1.5 text-sm px-3 py-2 rounded" style={{ background: C.maroon, color: "#fff" }}><Icon name="user-plus" size={15} /> Add teacher</button>
      </div>

      <div className="rounded-lg overflow-hidden" style={{ background: "#fff", border: `1px solid ${C.border}` }}>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr style={{ background: C.parchmentAlt, color: C.slate }}><th className="text-left px-3 py-2">Username</th><th className="text-left px-3 py-2">Name</th><th className="text-left px-3 py-2">Email</th><th className="text-left px-3 py-2">Assigned classes</th><th className="text-left px-3 py-2">Status</th><th className="text-right px-3 py-2">Actions</th></tr></thead>
            <tbody>
              {auth.teachers.map((t) => (
                <tr key={t.username} style={{ borderTop: `1px solid ${C.border}` }}>
                  <td className="px-3 py-2" style={{ fontFamily: "ui-monospace" }}>{t.username}</td>
                  <td className="px-3 py-2">{t.name}</td>
                  <td className="px-3 py-2" style={{ color: C.slate }}>{t.email}</td>
                  <td className="px-3 py-2"><div className="flex flex-wrap gap-1">{(t.assignments || []).length ? t.assignments.map((a) => <Badge key={classKey(a)} color={C.blue} soft={C.blueSoft}>{classLabel(a)}</Badge>) : <span style={{ color: C.slate }}>None</span>}</div></td>
                  <td className="px-3 py-2">{t.active === false ? <Badge color={C.red} soft={C.redSoft}>Deactivated</Badge> : <Badge color={C.green} soft={C.greenSoft}>Active</Badge>}</td>
                  <td className="px-3 py-2 text-right">
                    {delUser === t.username ? (
                      <ConfirmInline label="Delete account?" onConfirm={() => removeTeacher(t.username)} onCancel={() => setDelUser(null)} />
                    ) : (
                      <span className="inline-flex gap-2 items-center">
                        <button onClick={() => setEditing(t)} title="Edit / reassign classes"><Icon name="pencil" size={15} color={C.slate} /></button>
                        <button onClick={() => setResetting(t)} title="Reset password"><Icon name="key" size={15} color={C.amber} /></button>
                        <button onClick={() => updateTeacher(t.username, { active: t.active === false ? true : false })} title={t.active === false ? "Reactivate" : "Deactivate"}>
                          <Icon name={t.active === false ? "inbox" : "archive"} size={15} color={t.active === false ? C.green : C.amber} />
                        </button>
                        <button onClick={() => setDelUser(t.username)} title="Delete account"><Icon name="trash" size={15} color={C.red} /></button>
                      </span>
                    )}
                  </td>
                </tr>
              ))}
              {auth.teachers.length === 0 && <tr><td colSpan={6} className="px-3 py-6 text-center" style={{ color: C.slate }}>No teacher accounts yet. Add one to get started.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {showAdd && <TeacherForm existingUsernames={["admin", ...auth.teachers.map((t) => t.username)]} onCancel={() => setShowAdd(false)} onSave={addTeacher} />}
      {editing && <TeacherForm initial={editing} existingUsernames={["admin", ...auth.teachers.filter((t) => t.username !== editing.username).map((t) => t.username)]} onCancel={() => setEditing(null)} onSave={(t) => updateTeacher(editing.username, t)} />}
      {resetting && <ResetPasswordModal teacher={resetting} onClose={() => setResetting(null)} onReset={(pw) => { resetPassword(resetting.username, pw); setResetting(null); }} />}
      {justCreated && <CredentialsCard teacher={justCreated} onClose={() => setJustCreated(null)} />}
    </div>
  );
}

function TeacherForm({ initial, existingUsernames, onCancel, onSave }) {
  const [name, setName] = useState(initial?.name || "");
  const [email, setEmail] = useState(initial?.email || "");
  const [username, setUsername] = useState(initial?.username || "");
  const [password, setPassword] = useState("");
  const [autoUser, setAutoUser] = useState(!initial);
  const [assignments, setAssignments] = useState(initial?.assignments || []);
  const [course, setCourse] = useState(COURSES[0].code);
  const [semester, setSemester] = useState("I");
  const [section, setSection] = useState("A");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (!initial && autoUser && name.trim()) {
      let base = name.trim().toLowerCase().replace(/[^a-z]+/g, ".").replace(/^\.+|\.+$/g, "");
      let candidate = base || "teacher";
      let n = 1;
      while (existingUsernames.includes(candidate)) { candidate = `${base}${n}`; n++; }
      setUsername(candidate);
    }
    // eslint-disable-next-line
  }, [name, autoUser]);

  function addAssignment() {
    const combo = { courseCode: course, semester, section };
    if (assignments.some((a) => classKey(a) === classKey(combo))) return;
    setAssignments([...assignments, combo]);
  }
  function removeAssignment(key) { setAssignments(assignments.filter((a) => classKey(a) !== key)); }

  async function submit() {
    setErr("");
    if (!name.trim()) { setErr("Please enter the teacher's name."); return; }
    if (!email.trim() || !email.includes("@")) { setErr("Please enter a valid email — this is used for password-reset verification."); return; }
    if (!username.trim()) { setErr("Please enter a username."); return; }
    if (existingUsernames.includes(username.trim().toLowerCase())) { setErr("This username is already in use."); return; }
    if (!initial && !password) { setErr("Please set a password, or click Generate."); return; }
    setBusy(true);
    const passwordHash = initial ? initial.passwordHash : await hashPassword(password);
    setBusy(false);
    const teacher = { username: username.trim(), name: name.trim(), email: email.trim(), passwordHash, assignments, active: initial ? initial.active : true, plainPasswordForDisplay: initial ? undefined : password };
    onSave(teacher);
  }

  return (
    <Modal title={initial ? "Edit teacher" : "Add new teacher"} onClose={onCancel} wide>
      <div className="grid sm:grid-cols-2 gap-x-4">
        <Field label="Full name"><input style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder="Teacher's full name" /></Field>
        <Field label="Email (for password recovery)"><input style={inputStyle} value={email} onChange={(e) => setEmail(e.target.value)} placeholder="teacher@example.com" /></Field>
        <Field label="Username"><input style={inputStyle} value={username} disabled={!!initial} onChange={(e) => { setAutoUser(false); setUsername(e.target.value); }} placeholder="username" /></Field>
        {!initial && (
          <Field label="Password">
            <div className="flex gap-2">
              <div className="flex-1"><PasswordInput value={password} onChange={setPassword} placeholder="Set a password" /></div>
              <button type="button" onClick={() => setPassword(generatePassword())} className="text-xs px-2 rounded" style={{ border: `1px solid ${C.border}` }}>Generate</button>
            </div>
          </Field>
        )}
      </div>

      <div className="mt-2 mb-1 text-xs uppercase tracking-wide" style={{ color: C.slate }}>Assigned classes</div>
      <div className="flex flex-wrap gap-1.5 mb-3">
        {assignments.map((a) => (
          <span key={classKey(a)} className="text-xs px-2 py-1 rounded inline-flex items-center gap-1" style={{ background: C.blueSoft, color: C.blue }}>
            {classLabel(a)}<button onClick={() => removeAssignment(classKey(a))}><Icon name="x" size={11} /></button>
          </span>
        ))}
        {assignments.length === 0 && <span className="text-xs" style={{ color: C.slate }}>No classes added yet.</span>}
      </div>
      <div className="flex flex-wrap items-end gap-2 mb-4">
        <Field label="Programme"><select style={inputStyle} value={course} onChange={(e) => setCourse(e.target.value)}>{COURSES.map((c) => <option key={c.code} value={c.code}>{c.code}</option>)}</select></Field>
        <Field label="Semester"><select style={inputStyle} value={semester} onChange={(e) => setSemester(e.target.value)}>{SEMESTERS.map((s) => <option key={s} value={s}>{s}</option>)}</select></Field>
        <Field label="Section"><select style={inputStyle} value={section} onChange={(e) => setSection(e.target.value)}>{SECTIONS.map((s) => <option key={s} value={s}>{s}</option>)}</select></Field>
        <button onClick={addAssignment} className="text-xs px-3 py-2 rounded mb-3 flex items-center gap-1" style={{ border: `1px solid ${C.border}`, background: "#fff" }}><Icon name="plus" size={13} /> Add class</button>
      </div>

      {err && <div className="text-xs mb-3" style={{ color: C.red }}>{err}</div>}
      <div className="flex justify-end gap-2 mt-2">
        <button onClick={onCancel} className="px-3 py-2 rounded text-sm" style={{ border: `1px solid ${C.border}` }}>Cancel</button>
        <button disabled={busy} onClick={submit} className="px-3 py-2 rounded text-sm flex items-center gap-1.5" style={{ background: C.maroon, color: "#fff" }}>{busy ? <Icon name="loader" size={14} /> : <Icon name="save" size={14} />} Save</button>
      </div>
    </Modal>
  );
}

function ResetPasswordModal({ teacher, onClose, onReset }) {
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  function submit() {
    if (pw.length < 6) { setErr("Password must be at least 6 characters."); return; }
    onReset(pw);
  }
  return (
    <Modal title={`Reset password — ${teacher.name}`} onClose={onClose}>
      <div className="text-xs mb-3" style={{ color: C.slate }}>Set a new password for <strong>{teacher.username}</strong>. Share it with them directly — it won't be shown again after this.</div>
      <Field label="New password">
        <div className="flex gap-2"><div className="flex-1"><PasswordInput value={pw} onChange={setPw} placeholder="New password" /></div>
          <button type="button" onClick={() => setPw(generatePassword())} className="text-xs px-2 rounded" style={{ border: `1px solid ${C.border}` }}>Generate</button></div>
      </Field>
      {err && <div className="text-xs mb-3" style={{ color: C.red }}>{err}</div>}
      <div className="flex justify-end gap-2 mt-2">
        <button onClick={onClose} className="px-3 py-2 rounded text-sm" style={{ border: `1px solid ${C.border}` }}>Cancel</button>
        <button onClick={submit} className="px-3 py-2 rounded text-sm flex items-center gap-1.5" style={{ background: C.maroon, color: "#fff" }}><Icon name="key" size={14} /> Set password</button>
      </div>
    </Modal>
  );
}

function CredentialsCard({ teacher, onClose }) {
  const text = `Chemistry Lab Manager login\nUsername: ${teacher.username}\nPassword: ${teacher.plainPasswordForDisplay}`;
  function copy() { try { navigator.clipboard.writeText(text); } catch (e) {} }
  return (
    <Modal title="Teacher account created" onClose={onClose}>
      <div className="text-xs mb-3" style={{ color: C.slate }}>Share these sign-in details with {teacher.name}. For security, the password won't be shown again — use "Reset password" later if it's ever lost.</div>
      <div className="rounded p-3 mb-3" style={{ background: C.parchmentAlt, border: `1px solid ${C.border}`, fontFamily: "ui-monospace" }}>
        <div>Username: <strong>{teacher.username}</strong></div>
        <div>Password: <strong>{teacher.plainPasswordForDisplay}</strong></div>
      </div>
      <div className="flex justify-end gap-2">
        <button onClick={copy} className="px-3 py-2 rounded text-sm flex items-center gap-1.5" style={{ border: `1px solid ${C.border}` }}><Icon name="copy" size={14} /> Copy</button>
        <button onClick={onClose} className="px-3 py-2 rounded text-sm" style={{ background: C.maroon, color: "#fff" }}>Done</button>
      </div>
    </Modal>
  );
}

/* ================================================================== */
ReactDOM.createRoot(document.getElementById("root")).render(<AppRoot />);
</script>
</body>
</html>
